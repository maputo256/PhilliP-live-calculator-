<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Live Calculator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9; /* Soft light background */
            margin: 0;
            font-family: Arial, sans-serif;
            touch-action: manipulation; /* To reduce tap lag */
        }

        /* Live Calculator Title - Colorful design with animation */
        .live-title {
            font-size: 38px; 
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            
            /* Gradient Color */
            background: linear-gradient(135deg, #1f6feb, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Shadow and Pulse Animation */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        /* Animation Effect (Glow and Pulse) */
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 5px rgba(31, 111, 235, 0.3));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(39, 174, 96, 0.5));
                transform: scale(1.03); /* Slight zoom */
            }
            100% {
                filter: drop-shadow(0 0 5px rgba(243, 156, 18, 0.3));
                transform: scale(1);
            }
        }

        .calculator {
            background-color: #333; /* Dark calculator body */
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 320px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 30px;
            text-align: right;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 10px;
            background: #222;
            color: #fff;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #555;
            color: white;
            transition: background 0.1s, transform 0.05s;
            -webkit-tap-highlight-color: transparent;
        }

        /* Visual feedback on tap */
        button:active {
            transform: scale(0.95);
            background-color: #777;
        }

        .operator { background-color: #f39c12; }
        .operator:hover { background-color: #e67e22; }
        .equal { background-color: #27ae60; grid-column: span 2; }
        .clear { background-color: #c0392b; grid-column: span 2; }
    </style>
</head>
<body>

<div class="live-title">PhilliP Live Calculator</div>

<div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="addToDisplay('/')">/</button>
        
        <button onclick="addToDisplay('7')">7</button>
        <button onclick="addToDisplay('8')">8</button>
        <button onclick="addToDisplay('9')">9</button>
        <button class="operator" onclick="addToDisplay('*')">×</button>
        
        <button onclick="addToDisplay('4')">4</button>
        <button onclick="addToDisplay('5')">5</button>
        <button onclick="addToDisplay('6')">6</button>
        <button class="operator" onclick="addToDisplay('-')">-</button>
        
        <button onclick="addToDisplay('1')">1</button>
        <button onclick="addToDisplay('2')">2</button>
        <button onclick="addToDisplay('3')">3</button>
        <button class="operator" onclick="addToDisplay('+')">+</button>
        
        <button onclick="addToDisplay('0')">0</button>
        <button onclick="addToDisplay('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function addToDisplay(value) {
        if (display.value === "Error") display.value = "";
        display.value += value;
    }

    function clearDisplay() {
        display.value = '';
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            if(display.value) {
                // Using a Function constructor as a safer alternative to eval()
                display.value = Function('"use strict";return (' + display.value + ')')();
            }
        } catch (e) {
            display.value = 'Error';
        }
    }
</script>
</body>
</html>
